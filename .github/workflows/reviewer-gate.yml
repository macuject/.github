name: Reviewer Gate

# Reusable workflow. When a human is requested as a reviewer on a PR, checks
# that the automated Claude review has run (one of `inputs.reviewed_labels`
# is present) and has been answered since it finished (a human comment,
# review, or commit newer than the review). Otherwise it removes the review
# request and asks the author to trigger and address the review first.
#
# The review's completion time is the newest comment by `inputs.review_bot`:
# the review action posts a tracking comment when it starts and edits it when
# it finishes, so `updated_at` marks completion. The `labeled` event for a
# reviewed label is the fallback when no such comment exists.
#
# Inert until a repository opts in by calling it on
# `pull_request: [review_requested]`. Dependabot PRs are skipped: their
# review and approval path is handled by the Dependabot automation.

on:
  workflow_call:
    inputs:
      reviewed_labels:
        description: >-
          Comma-separated labels, any one of which shows the automated review
          has run on the PR.
        type: string
        default: claude-reviewed,claude-reviewed-again
      review_bot:
        description: >-
          Login of the account that posts the automated review, used to find
          when the review finished.
        type: string
        default: claude[bot]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'review_requested' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.requested_reviewer.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check the review ran and was answered
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_LABELS: ${{ inputs.reviewed_labels }}
          REVIEW_BOT: ${{ inputs.review_bot }}
        run: |
          set -euo pipefail

          DATA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,labels)
          STATE=$(jq -r '.state' <<<"$DATA")
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER not open (state=$STATE); skipping."
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WANTED=$(tr ',' '\n' <<<"$REVIEWED_LABELS" | sed 's/^ *//; s/ *$//' \
            | jq -R . | jq -cs 'map(select(. != ""))')
          if ! jq -e --argjson wanted "$WANTED" \
              '[.labels[].name] | any(. as $l | $wanted | index($l))' <<<"$DATA" >/dev/null; then
            echo "None of $WANTED present; the review has not run."
            echo "verdict=unreviewed" >> "$GITHUB_OUTPUT"
            echo "reviewed_at=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Completion time of the newest review: the bot edits its tracking
          # comment when the review finishes, so `updated_at` is the finish time.
          REVIEWED_AT=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"$REVIEW_BOT\") | .updated_at" | sort | tail -1)
          if [ -z "$REVIEWED_AT" ]; then
            REVIEWED_AT=$(gh api "repos/$REPO/issues/$PR_NUMBER/timeline" --paginate \
              --jq ".[] | select(.event == \"labeled\" and (.label.name | IN($WANTED[]))) | .created_at" \
              | sort | tail -1)
          fi
          echo "reviewed_at=$REVIEWED_AT" >> "$GITHUB_OUTPUT"
          if [ -z "$REVIEWED_AT" ]; then
            echo "Reviewed label present but no review comment or label event found; treating as unanswered."
            echo "verdict=unanswered" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest human activity: issue comments (excluding the review trigger
          # itself), review comments, reviews, and commits. Only comments from
          # `User` accounts count, so bot chatter never passes the gate.
          ANSWERED_AT=$( {
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq '.[] | select(.user.type == "User" and (.body | test("@claude review") | not)) | .created_at'
            gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate \
              --jq '.[] | select(.user.type == "User") | .created_at'
            gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
              --jq '.[] | select(.user.type == "User" and .submitted_at != null) | .submitted_at'
            gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
              --jq '.[].commit.committer.date'
          } | sort | tail -1)

          echo "reviewed_at=$REVIEWED_AT answered_at=${ANSWERED_AT:-none}"
          if [ -n "$ANSWERED_AT" ] \
              && [ "$(date -d "$ANSWERED_AT" +%s)" -gt "$(date -d "$REVIEWED_AT" +%s)" ]; then
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=unanswered" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove the review request and ask for the review first
        if: >-
          steps.check.outputs.verdict == 'unreviewed' ||
          steps.check.outputs.verdict == 'unanswered'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          TEAM: ${{ github.event.requested_team.slug }}
          VERDICT: ${{ steps.check.outputs.verdict }}
          REVIEWED_AT: ${{ steps.check.outputs.reviewed_at }}
        run: |
          set -euo pipefail

          if [ -n "$REVIEWER" ]; then
            echo "Removing review request for $REVIEWER."
            gh api -X DELETE "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
              --input - <<<"{\"reviewers\":[\"$REVIEWER\"]}" >/dev/null
            WHO="\`$REVIEWER\`"
          else
            echo "Removing review request for team $TEAM."
            gh api -X DELETE "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
              --input - <<<"{\"team_reviewers\":[\"$TEAM\"]}" >/dev/null
            WHO="team \`$TEAM\`"
          fi

          # One request per review: a marker comment newer than the latest
          # review means the author has already been asked.
          MARKER='<!-- reviewer-gate -->'
          LAST_ASK=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .created_at" | sort | tail -1)
          if [ -n "$LAST_ASK" ] && { [ -z "$REVIEWED_AT" ] \
              || [ "$(date -d "$LAST_ASK" +%s)" -gt "$(date -d "$REVIEWED_AT" +%s)" ]; }; then
            echo "Already asked at $LAST_ASK; not commenting again."
            exit 0
          fi

          # The review workflow ignores comments from bot accounts, so quoting
          # the trigger phrase here does not start a review.
          if [ "$VERDICT" = "unreviewed" ]; then
            REASON="the automated Claude review has not run on this PR yet. Please comment \`@claude review\`, address its findings with a reply or a commit, and then request the review again. Thanks!"
          else
            REASON="nothing has been posted since the automated Claude review finished. Please address its findings with a reply or a commit, and then request the review again. Thanks!"
          fi
          BODY=$(printf '%s\n@%s the review request for %s has been removed because %s' \
            "$MARKER" "$AUTHOR" "$WHO" "$REASON")
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
